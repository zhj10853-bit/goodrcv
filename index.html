<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>好评文案</title>
<style>
body { font-size: 18px; padding: 20px; }
button { padding: 12px 20px; font-size: 18px; margin-top: 20px; }
</style>
</head>
<body>

<h2>点击复制好评内容</h2>
<p id="text"></p>
<button onclick="copyText()">复制好评</button>

<script>
// 文案库
const texts = {
  A: [
    "感谢您的支持，收到您的好评我们非常开心！",
    "感谢选择我们的小店，您的满意是我们最大的动力！"
  ],
  B: [
    "产品质量很好，做工精细，实物非常满意。",
    "实物比图片更好看，质感非常棒。"
  ],
  C: [
    "发货速度快，包装严实，非常放心。",
    "快递很给力，送达非常及时。"
  ],
  D: [
    "客服态度很好，回复及时，非常贴心。",
    "服务非常周到，有问必答。"
  ]
};

// 获取 URL 参数
const urlParams = new URLSearchParams(window.location.search);
const set = urlParams.get("set") || "ABCD"; // 默认全部组合

// 随机从每个模块取一句
function pickRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

let finalText = "";
for (let char of set) {
  if (texts[char]) {
    finalText += pickRandom(texts[char]) + " ";
  }
}

document.getElementById("text").innerText = finalText;

// 复制功能
function copyText() {
  navigator.clipboard.writeText(finalText).then(() => {
    alert("已复制，感谢您的支持！");
  });
}
</script>

</body>
</html>

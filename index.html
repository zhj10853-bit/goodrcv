    // 去重保障但实际均来自原始文档不同条目，总数约230+
    const totalReviews = realReviews.length;
    document.getElementById('totalCount').innerText = totalReviews;

    // 随机获取一条真实好评
    function getRandomReview() {
        const randomIndex = Math.floor(Math.random() * totalReviews);
        return realReviews[randomIndex];
    }

    // 刷新显示
    function displayRandomReview() {
        const review = getRandomReview();
        const textarea = document.getElementById('reviewText');
        textarea.value = review;
        // 自动调整高度舒适 (保持原样)
    }

    // 复制功能
    function copyToClipboard() {
        const textarea = document.getElementById('reviewText');
        const text = textarea.value.trim();
        if (!text) {
            alert('暂无文案，请点击“刷新生成新文案”');
            return;
        }
        navigator.clipboard.writeText(text).then(() => {
            alert('✅ 好评已复制，可任意粘贴使用！');
        }).catch(() => {
            alert('复制失败，可手动选中复制');
        });
    }

    // 绑定事件
    document.getElementById('refreshBtn').addEventListener('click', displayRandomReview);
    document.getElementById('copyBtn').addEventListener('click', copyToClipboard);

    // 页面初始化随机展示一条好评
    displayRandomReview();
